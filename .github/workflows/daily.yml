# Daily Sydney fuel forecast, fully headless. Runs alongside the Claude scheduled task without touching main:
#   code   <- main (sydney/pipeline)
#   state  <- `data` branch (store/ + archive/), seeded from main's sydney/store and sydney/archive on first run
#   output -> GitHub Pages: /api/v1/{meta,forecast,stations,history}.json and the dashboard at /
#             + /api/v1/station/{id}.json, one per station (station_api.py; omitted with a meta warning if it fails)
name: daily-forecast

on:
  # Several runs a day; each replaces the day's snapshot row (update.py), so the latest run wins. NSW FuelCheck is live,
  # but Sydney stations change prices all day: of 2025-26 hikes, 7% are in by 06:00, 60% by noon, 90% by 18:00 and 96%
  # by 21:00 (cycle jumps of 8c+: 7% / 55% / 89% / 96%). So the first run makes the day's file early and the others
  # catch the jumps. The last run records (nearly) the day's close, which matches the history rows the model is trained
  # on (last price of the day, build_history.py); it's at 21:13, not later, so a late start still lands before midnight.
  # GitHub cron is UTC only and often starts late (the 06:30 run started at 09:33 on 22 Oct), so the slots avoid the
  # busy :00/:30 marks and back each other up. Times are AEDT / AEST.
  schedule:
    - cron: "13 18 * * *"   # 05:13 / 04:13: the day's first file, before the morning
    - cron: "13 23 * * *"   # 10:13 / 09:13
    - cron: "13 2 * * *"    # 13:13 / 12:13
    - cron: "13 6 * * *"    # 17:13 / 16:13
    - cron: "13 10 * * *"   # 21:13 / 20:13: the day's (near) close
  workflow_dispatch:
    inputs:
      backtest:
        description: "Rerun the walk-forward backtest (~8 min)"
        type: boolean
        default: false

# Least privilege: the workflow token starts read-only; each job asks for only what it needs. The build job runs the
# third-party Python packages with the NSW secrets, so it gets a read-only token, and nothing writes it to disk.
permissions:
  contents: read

concurrency:
  group: daily-forecast
  cancel-in-progress: false

# Actions are pinned to commit SHAs (the tag each one tracked), so a moved tag can't change what runs.
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
    env:
      TZ: Australia/Sydney
    outputs:
      fetched: ${{ steps.fetch.outcome == 'success' }}
      data_sha: ${{ steps.state.outputs.sha }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          path: src
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065   # v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: src/sydney/requirements.txt

      - run: pip install -q -r src/sydney/requirements.txt

      # Public repo: the data branch is read without a token
      - name: Check out state (data branch)
        id: state
        run: |
          mkdir state && cd state
          git init -q
          git remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads origin data >/dev/null; then
            git fetch -q --depth 1 origin data
            git checkout -q -b data FETCH_HEAD
          else
            echo "No data branch yet: seeding from main"
            git checkout -q --orphan data
            cp -r ../src/sydney/store ../src/sydney/archive .
          fi
          rm -rf pipeline && cp -r ../src/sydney/pipeline pipeline   # code always comes from main
          echo "sha=$(git rev-parse -q --verify HEAD || echo none)" >> "$GITHUB_OUTPUT"   # the save job checks it's unchanged

      - name: Fetch NSW, FRED, AIP, monthly history
        id: fetch
        env:
          NSW_API_KEY: ${{ secrets.NSW_API_KEY }}
          NSW_API_SECRET: ${{ secrets.NSW_API_SECRET }}
          VIC_API_KEY: ${{ secrets.VIC_API_KEY }}   # optional: VIC snapshots archived to archive/vic/
        run: python state/pipeline/fetch.py state state/inbox

      - name: Update store, model, dashboard
        env:
          BACKTEST_INPUT: ${{ inputs.backtest }}   # via env, never pasted into the script
        run: |
          BT=""
          # The walk-forward backtest (~8 min) once every 28 days, on whichever run comes first; store/backtest_ran
          # (on the data branch) holds the date of the last one. backtest.json's test_to can't be used: it follows the
          # monthly history files, which always lag.
          LAST=$(cat state/store/backtest_ran 2>/dev/null || echo 2000-01-01)
          if [ "$BACKTEST_INPUT" = "true" ] || [ $(( ($(date +%s) - $(date -d "$LAST" +%s)) / 86400 )) -ge 28 ]; then BT="--backtest"; fi
          bash state/pipeline/run_daily.sh "$PWD/state" "$PWD/state/inbox" $BT
          if [ -n "$BT" ]; then date +%F > state/store/backtest_ran; fi

      - name: Export app API (fails on stale or broken output)
        run: python state/pipeline/export_api.py state site

      # Saved whenever the fetch worked, even if a later step failed: a day's live snapshot can't be re-fetched later.
      # The save job commits it; Pages only deploys when everything passed.
      - name: Hand the state to the save job
        if: always() && steps.fetch.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02   # v4
        with:
          name: state
          path: |
            state/store
            state/archive
          retention-days: 1
          if-no-files-found: error

      - uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa   # v3
        with:
          path: site

  # Commits the state to the data branch. Runs no third-party code: git and gh only. The token is passed to the push
  # alone (an auth header for that one command), never stored in a remote URL or git config.
  save:
    needs: build
    if: always() && needs.build.outputs.fetched == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      actions: write   # keep-alive: re-enable this schedule (public repos pause crons after 60 idle days)
    env:
      TZ: Australia/Sydney
    steps:
      - name: Check out the data branch
        run: |
          if git ls-remote --exit-code --heads "https://github.com/${GITHUB_REPOSITORY}.git" data >/dev/null; then
            git clone -q --depth 1 --branch data "https://github.com/${GITHUB_REPOSITORY}.git" state
          else
            git init -q state && git -C state checkout -q --orphan data
            git -C state remote add origin "https://github.com/${GITHUB_REPOSITORY}.git"
            printf 'pipeline/\ninbox/\nout/\n__pycache__/\nstore/stations_today.json\n' > state/.gitignore
          fi

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093   # v4
        with:
          name: state
          path: new

      - name: Save state to data branch
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SHA: ${{ needs.build.outputs.data_sha }}
        run: |
          # The build's store/ and archive/ replace the branch's (deletions included, as git add -A did before)
          # Only over the commit the build started from: a data push made meanwhile isn't silently replaced
          HEAD_NOW=$(git -C state rev-parse -q --verify HEAD || echo none)
          if [ "$HEAD_NOW" != "$BUILD_SHA" ]; then echo "::error::data branch moved during the build ($BUILD_SHA -> $HEAD_NOW); not saving"; exit 1; fi
          test -f new/store/daily.csv || { echo "::error::state artifact has no store/daily.csv; not saving"; exit 1; }
          for d in store archive; do mkdir -p "state/$d" "new/$d"; rsync -a --delete "new/$d/" "state/$d/"; done
          cd state
          git config user.name "github-actions[bot]"
          git config user.email "41898299+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --quiet && { echo "no changes"; exit 0; }
          git commit -q -m "data: $(date +%F)"
          AUTH=$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)
          echo "::add-mask::$AUTH"
          git -c http.extraheader="AUTHORIZATION: basic $AUTH" push -q origin data

      - name: Keep schedule enabled
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/daily.yml/enable" || true

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b   # v5
      - id: deploy
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e   # v4
