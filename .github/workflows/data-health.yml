# Watches the app's data and fixes what it can (sydney/pipeline/health.py, remediate.py).
#   after every daily-forecast run, and every 30 minutes (GitHub skips and delays scheduled runs, so the check can't
#   only follow them): checks the published API like the app does, reruns the pipeline for problems a rerun fixes
#   (within a daily budget), re-enables a paused schedule, and opens / updates / closes one `data-health` issue that
#   @mentions the owner. Runs no third-party code: Python's standard library and the gh CLI only.
name: data-health

on:
  workflow_run:
    workflows: [daily-forecast]
    types: [completed]
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:

permissions:
  contents: read

# One check at a time, so two can't both start a pipeline run
concurrency:
  group: data-health
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write   # start daily.yml, re-enable its schedule
      issues: write    # the data-health alert issue
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262   # v4
        with:
          sparse-checkout: sydney/pipeline
          persist-credentials: false

      - name: Self-test the checks and the fix rules
        run: python3 -m unittest sydney/pipeline/test_health.py

      - name: Check the published data
        env:
          AFTER_RUN: ${{ github.event_name == 'workflow_run' }}
        run: |
          # Straight after a pipeline run, give Pages a moment to serve the new deploy
          if [ "$AFTER_RUN" = "true" ]; then sleep 45; fi
          python3 sydney/pipeline/health.py --out report.json

      - name: Fix and alert
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 sydney/pipeline/remediate.py report.json
